name: HERMES — mission cloud et galaxie iPhone
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hermes-galaxie-cloud-publication
  cancel-in-progress: false
jobs:
  run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Explorer de nouvelles ressources publiques
        run: python cloud/scout.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Historiser les mesures réelles
        run: |
          git config user.name "hermes-cloud[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/state.json site/missions.json
          git diff --cached --quiet || (git commit -m "HERMES : mission cloud $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4